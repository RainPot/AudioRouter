name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 显示 Swift 版本
        run: swift --version

      - name: 运行测试
        run: swift test

      - name: 打包 DMG
        run: zsh scripts/package_app.sh

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" .build/dist/*.dmg --clobber
          else
            gh release create "$GITHUB_REF_NAME" .build/dist/*.dmg --title "$GITHUB_REF_NAME" --generate-notes
          fi
